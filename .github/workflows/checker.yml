name: Ppomppu Watcher

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests beautifulsoup4

      - name: 스크립트 실행
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: python main.py

      - name: 발송 이력 갱신
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_ids.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent posts history" && git push)
